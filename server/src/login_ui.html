<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay Admin Login</title>
<style>
:root {
  --bg: #0e1117; --panel: #161b22; --panel2: #1c2129;
  --border: #2d333b; --text: #e6edf3; --muted: #8b949e;
  --green: #3fb950; --blue: #58a6ff; --off: #f85149;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text); min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 16px;
  background: var(--bg) url('/static/bg.png') center top / cover no-repeat fixed;
}
body::before {
  content: ""; position: fixed; inset: 0; background: rgba(14,17,23,.82);
  z-index: -1; pointer-events: none;
}
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  width: 100%; max-width: 380px; padding: 36px 32px;
}
h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
input {
  width: 100%; padding: 10px 14px; margin-bottom: 18px; font-size: 14px;
  background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); outline: none;
}
input:focus { border-color: var(--blue); }
button {
  width: 100%; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer;
  background: var(--blue); color: #fff; border: none; border-radius: 8px;
}
button:hover { opacity: .9; }
.err { color: var(--off); font-size: 13px; margin-top: 14px; min-height: 18px; }
.hint { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
.hint a { color: var(--blue); text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Relay Admin</h1>
  <div class="sub">Enter your administrator username and password to sign in</div>
  <form id="f">
    <label>Username</label>
    <input type="text" id="u" autocomplete="username" placeholder="Admin username" required>
    <label>Password</label>
    <input type="password" id="p" autocomplete="current-password" placeholder="Admin password" required>
    <button type="submit">Sign In</button>
  </form>
  <div class="err" id="err"></div>
  <div class="hint"><a href="/status/">View public device status page →</a></div>
</div>

<script>
const $ = s => document.querySelector(s);
$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  $('#err').textContent = '';
  const username = $('#u').value.trim();
  const password = $('#p').value;
  try {
    const r = await fetch('/api/admin/login/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const d = await r.json();
    if (r.ok && d.session) {
      localStorage.setItem('relaySession', d.session);
      localStorage.setItem('relaySessionUser', d.username);
      location.href = '/jiyin004/';
    } else {
      $('#err').textContent = d.error || 'Login failed';
    }
  } catch (err) {
    $('#err').textContent = 'Network error: ' + err.message;
  }
});
</script>
</body>
</html>
